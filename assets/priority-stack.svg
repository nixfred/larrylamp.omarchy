<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">Session priority stack</title>
  <desc id="d">When several Claude Code sessions run at once, the one with the highest state wins: wait (needs you) 5, fail 4, think 3, ship (done) 2, idle 1. A wait from a host that stopped heartbeating counts as idle.</desc>
  <defs><style>
    .k { font: 700 13px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #2ea8ff; letter-spacing: 4px; }
    .t { font: 700 16px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .d { font: 15px 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .s { font: 13px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8197b5; }
    .n { font: 12.5px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #6f86a6; }
  </style></defs>
  <rect width="1200" height="470" rx="22" fill="#05080e"/>
  <rect x="1" y="1" width="1198" height="468" rx="21" fill="none" stroke="#1a2638" stroke-width="2"/>
  <text x="40" y="52" class="k">WHO MATTERS MOST  /  SESSION PRIORITY</text>
  <text x="1160" y="52" class="n" text-anchor="end">top = the highest state across every session</text>
  <g><polygon points="88.0,344 608.0,344 590.0,362 70.0,362" fill="#5b7fa8" fill-opacity="0.32" stroke="#5b7fa8" stroke-width="1.5"/><rect x="70.0" y="362" width="520" height="40" fill="#0b111b" stroke="#5b7fa8" stroke-width="1.5"/><polygon points="590.0,362 608.0,344 608.0,384 590.0,402" fill="#5b7fa8" fill-opacity="0.15" stroke="#5b7fa8" stroke-width="1.5"/><text x="330" y="388" text-anchor="middle" class="t" style="fill:#5b7fa8">1  idle</text></g><line x1="620.0" y1="382" x2="700" y2="382" stroke="#1d2b42" stroke-dasharray="3 5"/><text x="716" y="387" class="d"><tspan style="fill:#5b7fa8;font-weight:700">idle</tspan></text><g><polygon points="123.0,282 573.0,282 555.0,300 105.0,300" fill="#2dff9a" fill-opacity="0.32" stroke="#2dff9a" stroke-width="1.5"/><rect x="105.0" y="300" width="450" height="40" fill="#0b111b" stroke="#2dff9a" stroke-width="1.5"/><polygon points="555.0,300 573.0,282 573.0,322 555.0,340" fill="#2dff9a" fill-opacity="0.15" stroke="#2dff9a" stroke-width="1.5"/><text x="330" y="326" text-anchor="middle" class="t" style="fill:#2dff9a">2  ship</text></g><line x1="585.0" y1="320" x2="700" y2="320" stroke="#1d2b42" stroke-dasharray="3 5"/><text x="716" y="325" class="d"><tspan style="fill:#2dff9a;font-weight:700">done</tspan></text><g><polygon points="158.0,220 538.0,220 520.0,238 140.0,238" fill="#a855ff" fill-opacity="0.32" stroke="#a855ff" stroke-width="1.5"/><rect x="140.0" y="238" width="380" height="40" fill="#0b111b" stroke="#a855ff" stroke-width="1.5"/><polygon points="520.0,238 538.0,220 538.0,260 520.0,278" fill="#a855ff" fill-opacity="0.15" stroke="#a855ff" stroke-width="1.5"/><text x="330" y="264" text-anchor="middle" class="t" style="fill:#a855ff">3  think</text></g><line x1="550.0" y1="258" x2="700" y2="258" stroke="#1d2b42" stroke-dasharray="3 5"/><text x="716" y="263" class="d"><tspan style="fill:#a855ff;font-weight:700">thinking</tspan></text><g><polygon points="193.0,158 503.0,158 485.0,176 175.0,176" fill="#ff4d5e" fill-opacity="0.32" stroke="#ff4d5e" stroke-width="1.5"/><rect x="175.0" y="176" width="310" height="40" fill="#0b111b" stroke="#ff4d5e" stroke-width="1.5"/><polygon points="485.0,176 503.0,158 503.0,198 485.0,216" fill="#ff4d5e" fill-opacity="0.15" stroke="#ff4d5e" stroke-width="1.5"/><text x="330" y="202" text-anchor="middle" class="t" style="fill:#ff4d5e">4  fail</text></g><line x1="515.0" y1="196" x2="700" y2="196" stroke="#1d2b42" stroke-dasharray="3 5"/><text x="716" y="201" class="d"><tspan style="fill:#ff4d5e;font-weight:700">failed</tspan></text><g><polygon points="228.0,96 468.0,96 450.0,114 210.0,114" fill="#f5a623" fill-opacity="0.32" stroke="#f5a623" stroke-width="1.5"/><rect x="210.0" y="114" width="240" height="40" fill="#0b111b" stroke="#f5a623" stroke-width="1.5"/><polygon points="450.0,114 468.0,96 468.0,136 450.0,154" fill="#f5a623" fill-opacity="0.15" stroke="#f5a623" stroke-width="1.5"/><text x="330" y="140" text-anchor="middle" class="t" style="fill:#f5a623">5  wait</text><polygon points="228.0,96 468.0,96 450.0,114 210.0,114" fill="#f5a623" fill-opacity="0.5"><animate attributeName="fill-opacity" values="0.6;0.1;0.6" dur="1.4s" repeatCount="indefinite"/></polygon></g><line x1="480.0" y1="134" x2="700" y2="134" stroke="#1d2b42" stroke-dasharray="3 5"/><text x="716" y="139" class="d"><tspan style="fill:#f5a623;font-weight:700">needs you</tspan></text><text x="826" y="139" class="s">beats everything: you are needed</text><text x="826" y="201" class="s">something broke; you want to know</text><text x="826" y="263" class="s">Claude is working</text><text x="826" y="325" class="s">finished, nothing to do</text><text x="826" y="387" class="s">quiet; also any "wait" from a stale host</text>
  <text x="40" y="446" class="n">Many sessions, one answer: larrylamp.py reports the highest layer as "top". A silent host's "wait" drops to idle, so the amber count never lies.</text>
</svg>
