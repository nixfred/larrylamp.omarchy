<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">Larry Lamp ring and session states</title>
  <desc id="d">Bar ring: live LED colour, breathing, lamp dark, lamp offline with broker up, offline, and the amber needs-you count. Panel session dots: amber needs you, red failed, purple thinking, green done, slate idle.</desc>
  <defs>
    <filter id="sg" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .k { font: 700 13px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #2ea8ff; letter-spacing: 4px; }
      .t { font: 700 18px 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e6f0ff; }
      .s { font: 13px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8197b5; }
      .bn { font: 800 14px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #111; }
      .n { font: 12.5px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #6f86a6; }
    </style>
  </defs>
  <rect width="1200" height="640" rx="22" fill="#05080e"/>
  <rect x="1" y="1" width="1198" height="638" rx="21" fill="none" stroke="#1a2638" stroke-width="2"/>
  <text x="40" y="62" class="k">THE BAR RING</text>
  <text x="740" y="62" class="k">SESSION DOTS (PANEL)</text>
  <g transform="translate(40 128)"><rect x="0" y="-32" width="660" height="64" rx="12" fill="#0b111b" stroke="#18243a"/><circle cx="90" cy="0" r="17" fill="none" stroke="#2ea8ff" stroke-opacity="1" stroke-width="7" filter="url(#sg)"></circle><circle cx="90" cy="0" r="5.5" fill="#e6edf7" fill-opacity="1"/><text x="180" y="-4" class="t">live colour</text><text x="180" y="18" class="s">the lamp's LED ring, exact hex, right now</text></g><g transform="translate(40 204)"><rect x="0" y="-32" width="660" height="64" rx="12" fill="#0b111b" stroke="#18243a"/><circle cx="90" cy="0" r="17" fill="none" stroke="#ff3df2" stroke-opacity="1" stroke-width="7" filter="url(#sg)"><animate attributeName="opacity" values="1;0.45;1" dur="2.8s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/></circle><circle cx="90" cy="0" r="5.5" fill="#e6edf7" fill-opacity="1"/><text x="180" y="-4" class="t">breathing / pulse</text><text x="180" y="18" class="s">fades to 45% and back, 1.4 s each way</text></g><g transform="translate(40 280)"><rect x="0" y="-32" width="660" height="64" rx="12" fill="#0b111b" stroke="#18243a"/><circle cx="90" cy="0" r="17" fill="none" stroke="#e6edf7" stroke-opacity="0.35" stroke-width="7"></circle><circle cx="90" cy="0" r="5.5" fill="#e6edf7" fill-opacity="1"/><text x="180" y="-4" class="t">lamp dark</text><text x="180" y="18" class="s">the lamp answers, its LED is off or black</text></g><g transform="translate(40 356)"><rect x="0" y="-32" width="660" height="64" rx="12" fill="#0b111b" stroke="#18243a"/><circle cx="90" cy="0" r="17" fill="none" stroke="#e6edf7" stroke-opacity="0.3" stroke-width="7"></circle><circle cx="90" cy="0" r="5.5" fill="#e6edf7" fill-opacity="0.3"/><circle cx="132" cy="0" r="12" fill="#f5a623"></circle><text x="132" y="5" text-anchor="middle" class="bn">1</text><text x="180" y="-4" class="t">lamp offline, broker up</text><text x="180" y="18" class="s">sessions and the amber count keep working</text></g><g transform="translate(40 432)"><rect x="0" y="-32" width="660" height="64" rx="12" fill="#0b111b" stroke="#18243a"/><circle cx="90" cy="0" r="17" fill="none" stroke="#e6edf7" stroke-opacity="0.3" stroke-width="7"></circle><circle cx="90" cy="0" r="5.5" fill="#e6edf7" fill-opacity="0.3"/><text x="180" y="-4" class="t">offline</text><text x="180" y="18" class="s">neither the lamp nor the broker answers</text></g><g transform="translate(40 508)"><rect x="0" y="-32" width="660" height="64" rx="12" fill="#0b111b" stroke="#18243a"/><circle cx="90" cy="0" r="17" fill="none" stroke="#2dff9a" stroke-opacity="1" stroke-width="7" filter="url(#sg)"></circle><circle cx="90" cy="0" r="5.5" fill="#e6edf7" fill-opacity="1"/><circle cx="132" cy="0" r="12" fill="#f5a623"><animate attributeName="r" values="12;13.5;12" dur="1.4s" repeatCount="indefinite"/></circle><text x="132" y="5" text-anchor="middle" class="bn">2</text><text x="180" y="-4" class="t">needs you</text><text x="180" y="18" class="s">amber count of sessions waiting on you</text></g><g transform="translate(740 128)"><rect x="0" y="-32" width="420" height="64" rx="12" fill="#0b111b" stroke="#18243a"/><circle cx="40" cy="0" r="9" fill="#f5a623" filter="url(#sg)"><animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="70" y="-4" class="t" style="fill:#f5a623">needs you</text><text x="70" y="18" class="s">state "wait"  #f5a623</text></g><g transform="translate(740 204)"><rect x="0" y="-32" width="420" height="64" rx="12" fill="#0b111b" stroke="#18243a"/><circle cx="40" cy="0" r="9" fill="#ff4d5e" filter="url(#sg)"></circle><text x="70" y="-4" class="t" style="fill:#ff4d5e">failed</text><text x="70" y="18" class="s">state "fail"  #ff4d5e</text></g><g transform="translate(740 280)"><rect x="0" y="-32" width="420" height="64" rx="12" fill="#0b111b" stroke="#18243a"/><circle cx="40" cy="0" r="9" fill="#a855ff" filter="url(#sg)"><animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/></circle><text x="70" y="-4" class="t" style="fill:#a855ff">thinking</text><text x="70" y="18" class="s">state "think"  #a855ff</text></g><g transform="translate(740 356)"><rect x="0" y="-32" width="420" height="64" rx="12" fill="#0b111b" stroke="#18243a"/><circle cx="40" cy="0" r="9" fill="#2dff9a" filter="url(#sg)"></circle><text x="70" y="-4" class="t" style="fill:#2dff9a">done</text><text x="70" y="18" class="s">state "ship"  #2dff9a</text></g><g transform="translate(740 432)"><rect x="0" y="-32" width="420" height="64" rx="12" fill="#0b111b" stroke="#18243a"/><circle cx="40" cy="0" r="9" fill="#5b7fa8" filter="url(#sg)"></circle><text x="70" y="-4" class="t" style="fill:#5b7fa8">idle</text><text x="70" y="18" class="s">state "idle"  #5b7fa8</text></g>
  <text x="40" y="604" class="n">The ring is not a status colour: it mirrors whatever the physical ring shows.</text>
  <text x="740" y="604" class="n">Fixed colours: no theme can turn "needs you" green.</text>
</svg>
