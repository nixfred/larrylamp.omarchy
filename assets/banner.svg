<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
  <title id="t">Larry Lamp for Omarchy</title>
  <desc id="d">A black desk lamp with a glowing blue LED ring beside the words Larry Lamp, Larry's body on your Omarchy bar, and a small bar showing the ring and an amber count of sessions that need you.</desc>
  <defs>
    <linearGradient id="hshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a3b"/><stop offset="0.55" stop-color="#0c1119"/><stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <radialGradient id="hface" cx="0.45" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#0b2b55"/><stop offset="0.7" stop-color="#061227"/><stop offset="1" stop-color="#03070f"/>
    </radialGradient>
    <radialGradient id="hhalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ea8ff" stop-opacity="0.75"/><stop offset="0.45" stop-color="#1060ff" stop-opacity="0.25"/><stop offset="1" stop-color="#1060ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hbeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ea8ff" stop-opacity="0.38"/><stop offset="1" stop-color="#2ea8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="hglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050a"/><stop offset="0.6" stop-color="#07101f"/><stop offset="1" stop-color="#0b1a33"/>
    </linearGradient>
    <radialGradient id="room" cx="0.22" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#1060ff" stop-opacity="0.35"/><stop offset="1" stop-color="#1060ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8fd3ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14233a" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="460" rx="22"/></clipPath>
    <style>
      .k { font: 700 15px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 6px; fill: #2ea8ff; }
      .big { font: 800 92px 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 4px; fill: url(#tg); }
      .sub { font: 500 28px 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #d6e6ff; }
      .m { font: 15px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #7f93b0; }
      .bar { font: 600 13px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #9fb3cf; }
      .tw { animation: tw 3.2s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateX(-300px); } to { transform: translateX(1400px); } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="460" fill="url(#bg)"/>
    <rect width="1280" height="460" fill="url(#grid)" opacity="0.55"/>
    <rect width="1280" height="460" fill="url(#room)">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect class="scan" x="0" y="0" width="160" height="460" fill="#2ea8ff" opacity="0.035"/>
    <circle class="tw" cx="640" cy="60" r="1.6" fill="#9fd8ff"/>
    <circle class="tw" style="animation-delay:.8s" cx="1180" cy="90" r="1.8" fill="#9fd8ff"/>
    <circle class="tw" style="animation-delay:1.6s" cx="980" cy="40" r="1.2" fill="#9fd8ff"/>
    <circle class="tw" style="animation-delay:2.2s" cx="1230" cy="250" r="1.4" fill="#9fd8ff"/>
    <circle class="tw" style="animation-delay:1.1s" cx="520" cy="400" r="1.3" fill="#9fd8ff"/>
    <line x1="30" y1="424" x2="540" y2="424" stroke="#2ea8ff" stroke-opacity="0.35" stroke-width="1.5"/>
    <g transform="translate(110 40)">
    <g>
      <path d="M52 103 L-70 382 L232 382 L107 221 Z" fill="url(#hbeam)">
        <animate attributeName="opacity" values="1;0.55;1" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <ellipse cx="80" cy="384" rx="170" ry="16" fill="#2ea8ff" opacity="0.18"/>
      <!-- base -->
      <path d="M135 350 V378 A95 16 0 0 0 325 378 V350 Z" fill="#0a0e15" stroke="#1d293a" stroke-width="2"/>
      <ellipse cx="230" cy="350" rx="95" ry="16" fill="#121a27" stroke="#2a3a52" stroke-width="2"/>
      <path d="M140 356 A95 16 0 0 0 320 356" fill="none" stroke="#2ea8ff" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="210" y="300" width="44" height="50" rx="5" fill="#0d121b" stroke="#2a3a52" stroke-width="2"/>
      <circle cx="232" cy="318" r="7" fill="#05080d" stroke="#3a4d69" stroke-width="2"/>
      <!-- arms -->
      <path d="M232 318 L318 200" stroke="#26354b" stroke-width="24" stroke-linecap="round"/>
      <path d="M232 318 L318 200" stroke="#0d121b" stroke-width="18" stroke-linecap="round"/>
      <path d="M318 200 L190 128" stroke="#26354b" stroke-width="22" stroke-linecap="round"/>
      <path d="M318 200 L190 128" stroke="#0d121b" stroke-width="16" stroke-linecap="round"/>
      <path d="M302 222 C352 250 360 186 334 172" fill="none" stroke="#c94a4a" stroke-opacity="0.55" stroke-width="1.6"/>
      <path d="M296 218 C344 262 368 196 338 166" fill="none" stroke="#5aa0ff" stroke-opacity="0.45" stroke-width="1.6"/>
      <circle cx="318" cy="200" r="15" fill="#0d121b" stroke="#2f415c" stroke-width="3"/>
      <circle cx="318" cy="200" r="4.5" fill="#2ea8ff"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="190" cy="128" r="11" fill="#0d121b" stroke="#2f415c" stroke-width="3"/>
      <!-- head -->
      <g transform="rotate(-25 186 124)"><animateTransform attributeName="transform" type="rotate" values="-25 186 124;-19 186 124;-25 186 124;-25 186 124" keyTimes="0;0.25;0.5;1" dur="7s" repeatCount="indefinite"/>
        <ellipse cx="62" cy="120" rx="70" ry="110" fill="url(#hhalo)">
          <animate attributeName="opacity" values="1;0.45;1" dur="2.8s" repeatCount="indefinite"/>
        </ellipse>
        <path d="M182 94 L70 55 A28 65 0 0 0 70 185 L182 150 A14 28 0 0 0 182 94 Z" fill="url(#hshade)" stroke="#2b3b54" stroke-width="2"/>
        <path d="M178 98 L72 60" stroke="#3b4f6e" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="70" cy="120" rx="28" ry="65" fill="url(#hface)" stroke="#1d2a3d" stroke-width="2"/>
        <ellipse cx="70" cy="120" rx="22" ry="54" fill="none" stroke="#2ea8ff" stroke-width="5.5" stroke-dasharray="4 3.3" filter="url(#hglow)">
          <animate attributeName="stroke-dashoffset" values="0;-14.6" dur="1.6s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2.8s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="70" cy="120" rx="13" ry="34" fill="none" stroke="#2ea8ff" stroke-opacity="0.25" stroke-width="1.5"/>
        <circle cx="76" cy="120" r="8" fill="#05080d" stroke="#3a4d69" stroke-width="2"/>
        <circle cx="74" cy="117" r="2.2" fill="#9fd8ff"/>
      </g>
    </g></g>

    <text x="580" y="112" class="k">OMARCHY BAR WIDGET  /  LARRY'S BODY</text>
    <text x="574" y="208" class="big">LARRY LAMP</text>
    <text x="580" y="256" class="sub">The lamp's live ring, right on your bar.</text>
    <text x="580" y="292" class="m">ring colour  .  who needs you  .  what Larry said  .  ask Larry</text>

    <!-- mini bar -->
    <rect x="580" y="330" width="640" height="46" rx="12" fill="#070c15" stroke="#1d2b42" stroke-width="1.5"/>
    <g class="bar">
      <rect x="598" y="343" width="22" height="20" rx="5" fill="#2ea8ff" fill-opacity="0.18" stroke="#2ea8ff" stroke-opacity="0.6"/>
      <text x="605" y="358" fill="#e6f2ff">1</text>
      <text x="634" y="358">2</text><text x="658" y="358">3</text><text x="682" y="358">4</text>
      <text x="830" y="358">Thu 15 Oct  09:41</text>
      <circle cx="1052" cy="353" r="4" fill="#9fb3cf" opacity="0.7"/>
      <rect x="1068" y="347" width="22" height="12" rx="3" fill="none" stroke="#9fb3cf" stroke-opacity="0.7"/>
      <rect x="1070" y="349" width="14" height="8" rx="1.5" fill="#2dff9a" fill-opacity="0.8"/>
    </g>
    <circle cx="1132" cy="353" r="9" fill="none" stroke="#2ea8ff" stroke-width="3.6" filter="url(#hglow)">
      <animate attributeName="opacity" values="1;0.45;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1132" cy="353" r="2.8" fill="#e6f2ff"/>
    <circle cx="1166" cy="353" r="10" fill="#f5a623">
      <animate attributeName="r" values="10;11.2;10" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1166" y="358" text-anchor="middle" style="font: 800 13px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #111;">2</text>
    <text x="1220" y="404" text-anchor="end" class="m" style="font-size:13px">2 sessions need you</text>
  </g>
  <rect x="1" y="1" width="1278" height="458" rx="21" fill="none" stroke="#1d2b42" stroke-width="2"/>
</svg>
