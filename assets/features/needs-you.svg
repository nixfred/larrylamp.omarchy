<svg xmlns="http://www.w3.org/2000/svg" width="400" height="210" viewBox="0 0 400 210" role="img" aria-labelledby="t">
  <title id="t">Who needs you: An amber count the moment a Claude Code session waits on you. Fixed amber, so no theme hides it.</title>
  <defs>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#05080e"/></linearGradient>
    <style>
      .h { font: 700 21px 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e6f0ff; }
      .b { font: 14px 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8ea3c0; }
    </style>
  </defs>
  <rect x="1" y="1" width="398" height="208" rx="18" fill="url(#bg)" stroke="#1a2638" stroke-width="2"/>
  <rect x="28" y="1" width="80" height="3" rx="1.5" fill="#2ea8ff"><animate attributeName="width" values="40;120;40" dur="4s" repeatCount="indefinite"/></rect>
  <g transform="translate(60 58)"><circle r="34" fill="#2ea8ff" fill-opacity="0.07" stroke="#2ea8ff" stroke-opacity="0.25"/><circle cx="-8" cy="0" r="18" fill="none" stroke="#8197b5" stroke-opacity="0.5" stroke-width="6"/><circle cx="18" cy="-12" r="14" fill="#f5a623" filter="url(#g)"><animate attributeName="r" values="14;16;14" dur="1.4s" repeatCount="indefinite"/></circle><text x="18" y="-7" text-anchor="middle" style="font:800 15px ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#111">3</text></g>
  <text x="110" y="66" class="h">Who needs you</text>
  <text x="28" y="124" class="b">An amber count the moment a Claude</text><text x="28" y="146" class="b">Code session waits on you. Fixed</text><text x="28" y="168" class="b">amber, so no theme hides it.</text>
</svg>
