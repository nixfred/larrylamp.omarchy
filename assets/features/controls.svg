<svg xmlns="http://www.w3.org/2000/svg" width="400" height="210" viewBox="0 0 400 210" role="img" aria-labelledby="t">
  <title id="t">Lamp controls: Nod, look at me, wake, sleep, theme light, mute this machine, open the console. The lamp follows your theme.</title>
  <defs>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#05080e"/></linearGradient>
    <style>
      .h { font: 700 21px 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e6f0ff; }
      .b { font: 14px 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8ea3c0; }
    </style>
  </defs>
  <rect x="1" y="1" width="398" height="208" rx="18" fill="url(#bg)" stroke="#1a2638" stroke-width="2"/>
  <rect x="28" y="1" width="80" height="3" rx="1.5" fill="#2ea8ff"><animate attributeName="width" values="40;120;40" dur="4s" repeatCount="indefinite"/></rect>
  <g transform="translate(60 58)"><circle r="34" fill="#2ea8ff" fill-opacity="0.07" stroke="#2ea8ff" stroke-opacity="0.25"/><g><animateTransform attributeName="transform" type="rotate" values="0;-14;0;0" keyTimes="0;0.2;0.4;1" dur="3s" repeatCount="indefinite"/><path d="M-6 -18 L22 -6 A6 14 0 0 1 14 14 L-12 0 Z" fill="#0d121b" stroke="#3a4d69" stroke-width="2"/><ellipse cx="18" cy="4" rx="5" ry="11" fill="none" stroke="#2ea8ff" stroke-width="3" transform="rotate(-25 18 4)"/></g><path d="M-8 -6 L-22 22" stroke="#3a4d69" stroke-width="6" stroke-linecap="round"/><rect x="-36" y="20" width="30" height="7" rx="3" fill="#3a4d69"/></g>
  <text x="110" y="66" class="h">Lamp controls</text>
  <text x="28" y="124" class="b">Nod, look at me, wake, sleep, theme</text><text x="28" y="146" class="b">light, mute this machine, open the</text><text x="28" y="168" class="b">console. The lamp follows your theme.</text>
</svg>
