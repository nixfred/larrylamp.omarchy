<svg xmlns="http://www.w3.org/2000/svg" width="400" height="210" viewBox="0 0 400 210" role="img" aria-labelledby="t">
  <title id="t">Ask Larry: Type in the panel, hit Enter. Larry answers out loud, through the lamp. Esc closes. One keystroke away.</title>
  <defs>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#05080e"/></linearGradient>
    <style>
      .h { font: 700 21px 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e6f0ff; }
      .b { font: 14px 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8ea3c0; }
    </style>
  </defs>
  <rect x="1" y="1" width="398" height="208" rx="18" fill="url(#bg)" stroke="#1a2638" stroke-width="2"/>
  <rect x="28" y="1" width="80" height="3" rx="1.5" fill="#2ea8ff"><animate attributeName="width" values="40;120;40" dur="4s" repeatCount="indefinite"/></rect>
  <g transform="translate(60 58)"><circle r="34" fill="#2ea8ff" fill-opacity="0.07" stroke="#2ea8ff" stroke-opacity="0.25"/><rect x="-30" y="-16" width="60" height="32" rx="7" fill="none" stroke="#2ea8ff" stroke-width="2.5"/><rect x="-20" y="-8" width="2.5" height="16" fill="#2ea8ff"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></rect><path d="M8 -4 l3 -7 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3z" fill="#f5a623"/></g>
  <text x="110" y="66" class="h">Ask Larry</text>
  <text x="28" y="124" class="b">Type in the panel, hit Enter. Larry</text><text x="28" y="146" class="b">answers out loud, through the lamp.</text><text x="28" y="168" class="b">Esc closes. One keystroke away.</text>
</svg>
