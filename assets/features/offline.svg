<svg xmlns="http://www.w3.org/2000/svg" width="400" height="210" viewBox="0 0 400 210" role="img" aria-labelledby="t">
  <title id="t">Offline-proof: 4 parallel polls, 4 s timeouts, never throws into the bar. Lamp off? The broker and the amber count still work.</title>
  <defs>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#05080e"/></linearGradient>
    <style>
      .h { font: 700 21px 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e6f0ff; }
      .b { font: 14px 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8ea3c0; }
    </style>
  </defs>
  <rect x="1" y="1" width="398" height="208" rx="18" fill="url(#bg)" stroke="#1a2638" stroke-width="2"/>
  <rect x="28" y="1" width="80" height="3" rx="1.5" fill="#2ea8ff"><animate attributeName="width" values="40;120;40" dur="4s" repeatCount="indefinite"/></rect>
  <g transform="translate(60 58)"><circle r="34" fill="#2ea8ff" fill-opacity="0.07" stroke="#2ea8ff" stroke-opacity="0.25"/><path d="M-26 0 H-8 M8 0 H26" stroke="#8197b5" stroke-width="4" stroke-linecap="round"/><rect x="-10" y="-10" width="8" height="20" rx="2" fill="#8197b5"><animateTransform attributeName="transform" type="translate" values="0 0;-5 0;0 0" dur="2s" repeatCount="indefinite"/></rect><rect x="2" y="-10" width="8" height="20" rx="2" fill="#2ea8ff"><animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="2s" repeatCount="indefinite"/></rect><path d="M-4 -24 l4 8 l4 -8" stroke="#2dff9a" stroke-width="2.5" fill="none"/></g>
  <text x="110" y="66" class="h">Offline-proof</text>
  <text x="28" y="124" class="b">4 parallel polls, 4 s timeouts, never</text><text x="28" y="146" class="b">throws into the bar. Lamp off? The</text><text x="28" y="168" class="b">broker and the amber count still work.</text>
</svg>
